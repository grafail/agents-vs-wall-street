<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 172" role="img" aria-label="Concept diagram"><defs><marker id="ca" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#5a6472"/></marker></defs><rect x="14" y="46" width="176" height="62" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.8" stroke-dasharray="6 3"/><text x="102.0" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#1f3a5f">READ & RESEARCH</text><text x="102.0" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">code + a roaming agent</text><text x="102.0" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">the agent picks its own searches;</text><text x="102.0" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">every fact cited</text><rect x="216" y="46" width="176" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/><text x="304.0" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#ffffff">BLIND ESTIMATE</text><text x="304.0" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#b8c4d8">one structured AI call</text><text x="304.0" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">opinion capped at 0.75x its</text><text x="304.0" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">measured error</text><rect x="418" y="46" width="176" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/><text x="506.0" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#ffffff">STREET CHECK</text><text x="506.0" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#b8c4d8">one structured AI call</text><text x="506.0" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">justify the gap vs Wall St, or</text><text x="506.0" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">move closer</text><rect x="620" y="46" width="176" height="62" rx="10" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.8"/><text x="708.0" y="72" text-anchor="middle" font-family="Georgia,serif" font-size="14.5" fill="#1f3a5f">VERIFY & SHIP</text><text x="708.0" y="90" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">code only</text><text x="708.0" y="124" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">safety checks + backup ladder +</text><text x="708.0" y="136" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" fill="#5a6472">audit trail</text><line x1="190" y1="77.0" x2="208" y2="77.0" stroke="#5a6472" stroke-width="1.6" marker-end="url(#ca)"/><line x1="392" y1="77.0" x2="410" y2="77.0" stroke="#5a6472" stroke-width="1.6" marker-end="url(#ca)"/><line x1="594" y1="77.0" x2="612" y2="77.0" stroke="#5a6472" stroke-width="1.6" marker-end="url(#ca)"/><line x1="405.0" y1="24" x2="405.0" y2="114" stroke="#8a2626" stroke-width="1.4" stroke-dasharray="5 4"/><text x="405.0" y="18" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" fill="#8a2626">consensus firewall — the street number cannot reach the estimator</text></svg>